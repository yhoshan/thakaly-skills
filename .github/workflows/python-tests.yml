name: Test Python skills
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run each runnable skill test suite
        shell: bash
        run: |
          set -euo pipefail
          skills=(
            gap-auditor
            literature-map
            reference-auditor
            study-extractor
            arabic-punctuation-auditor
            thakaly-source-attribution-auditor
            docx-bookmark-inventory
            docx-review-comments-extractor
            docx-highlight-extractor
          )
          for skill in "${skills[@]}"; do
            echo "::group::$skill"
            (cd "skills/$skill" && python -m unittest discover -s tests -v)
            echo "::endgroup::"
          done
